version: "3.8"
services:
  mysql:
    image: mysql:8.4.11
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: fangu
      MYSQL_USER: fangu
      MYSQL_PASSWORD: fangu123
      MYSQL_ROOT_PASSWORD: root123456
      TZ: Asia/Shanghai
    ports: ["3306:3306"]
    volumes:
      - mysqldata:/var/lib/mysql
      - ./backend/src/main/resources/db/mysql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/src/main/resources/db/mysql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  mysqldata:
  miniodata:
